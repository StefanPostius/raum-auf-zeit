<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAUM AUF ZEIT 0.6</title>
<style>body{font-family:system-ui;margin:0;background:#f3f6f4;color:#203136}header{background:#17383d;color:white;padding:20px}main{max-width:760px;margin:auto;padding:14px}.box,.card{background:white;border:1px solid #d4dfdc;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #a8bbb7;font:inherit}button{background:#28766f;color:white;font-weight:700;border:0}.tag{display:inline-block;padding:5px 8px;border-radius:15px;background:#fff0d1;font-size:12px}.live{background:#dff3e6;color:#1d653b}.bad{background:#f7e6e2;color:#7d312a}.fact{background:#f6f8f7;padding:8px;border-radius:8px;margin-top:7px}dialog{border:0;border-radius:15px;width:min(92%,620px)}textarea{min-height:160px}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style>
<header><h2 style="margin:0">RAUM AUF ZEIT 0.6</h2><div>Stuttgart · aktuelle roomstr-Daten, einfach übersetzt</div></header><main>
<div class="box"><span class="tag live">● Quelle heute geprüft</span><p><b>Jetzt arbeiten wir mit aktuell veröffentlichten roomstr-Angeboten.</b></p><div class="grid"><input id="von" type="date" value="2026-11-01"><input id="bis" type="date" value="2026-11-30"><select id="typ"><option>Ausstellung / Pop-up</option><option>Atelier / Projekt</option><option>Workshop / Event</option><option>Alles</option></select><select><option>Stuttgart</option></select></div><button onclick="go()">Aktuelle Angebote prüfen</button></div><div id="out"></div></main><dialog id="d"><div id="det"></div><button onclick="d.close()">Schließen</button></dialog>
<script>
const R=[
['Feuerbach – Büro/Praxis','Stuttgarter Str. 46','35–1.500 m²','2026-09-01',null,0,'8 €/m²','Ausstellung / Pop-up|Atelier / Projekt|Workshop / Event','info@disgmbh.eu','https://roomstr.de/sks_wrs/detail.xhtml?objectId=260717.203628.BU','Kreativflächen, Tageslicht, Aufzug, WC und Teeküchen. Kulturelle Nutzung im Einzelfall bestätigen.'],
['Lagerraum Kernerviertel','Stuttgart-Mitte','22 m²','2026-09-15',null,14,'220 € ab 2 Wochen','Atelier / Projekt','werastrasse.vermietung@gmx.de','https://roomstr.de/sks_wrs/detail.xhtml?objectId=260831.215845.PR','Beheizt, 6 Fenster, eigener Zugang, 3 m Deckenhöhe.'],
['Workshophaus Stuttgart','Stuttgart-Nord','55–300 m²','2026-01-01',null,30,'Tagespreis / Anfrage','Atelier / Projekt|Workshop / Event','s.langjahr@l-mc.com','https://roomstr.de/sks_wrs/detail.xhtml?objectId=240811.204928.BU','Kreativareal für Workshops und Projekte; mindestens 1 Monat.'],
['Laden-/Ausstellungsfläche West','Johannesstr. 97','102 m²','2028-01-01','2030-12-31',183,'25 €/m²','Ausstellung / Pop-up','hutzel.m@googlemail.com','https://roomstr.de/sks_wrs/detail.xhtml?objectId=260803.104448.EH','Große Schaufenster, ebenerdig. roomstr nennt Eventlocation und Pop-up.'],
['Penthouse-Büro Vaihingen','Meitnerstr. 10','20–124 m²','2026-07-01',null,0,'auf Anfrage','Atelier / Projekt|Workshop / Event','gewerbeflaechen@stuttgart.de','https://roomstr.de/sks_wrs/detail.xhtml?objectId=260630.163646.BU','Flexible Teilflächen und viel Tageslicht; andere Nutzung vorher klären.'],
['MayOffice','Stuttgart','20–355 m²','2026-01-01',null,30,'19 €/m²','Atelier / Projekt|Workshop / Event','gewerbeflaechen@stuttgart.de','https://roomstr.de/sks_wrs/detail.xhtml?objectId=260324.092602.BU','Als Kreativfläche markiert; Zwischennutzung nach Absprache.']];
let Q={};
function days(a,b){return Math.ceil((new Date(b)-new Date(a))/86400000)+1}
function state(r){let a=new Date(Q.a),b=new Date(Q.b),s=new Date(r[3]),e=r[4]?new Date(r[4]):null;if(b<s||(e&&a>e))return['bad','nicht passend'];if(r[5]&&days(Q.a,Q.b)<r[5])return['bad','Mindestdauer nicht erreicht'];return['live',e?'zeitlich passend':'Zeitraum möglich – bestätigen']}
function go(){Q={a:von.value,b:bis.value,t:typ.value};let x=R.filter(r=>Q.t==='Alles'||r[7].includes(Q.t));out.innerHTML=x.map((r,i)=>{let s=state(r);return `<div class="card"><small>Stuttgart · ${r[1]}</small><h3>${r[0]}</h3><span class="tag ${s[0]}">${s[1]}</span><div class="fact">${r[2]} · ${r[6]}</div><button onclick="openR(${i})">Verstehen & anfragen</button></div>`}).join('')||'<div class="box">Keine Treffer.</div>'}
function openR(i){let r=R[i],s=state(r);det.innerHTML=`<h3>${r[0]}</h3><span class="tag ${s[0]}">${s[1]}</span><p>${r[10]}</p><div class="fact"><b>Fläche:</b> ${r[2]}<br><b>Frühestens:</b> ${r[3]}<br><b>Kosten:</b> ${r[6]}</div><p><a href="${r[9]}" target="_blank">Originalquelle kontrollieren</a></p><button onclick="ask(${i})">Diesen Raum anfragen</button>`;d.showModal()}
function ask(i){let r=R[i];det.innerHTML=`<h3>Anfrage vorbereiten</h3><input id="nutzung" value="${Q.t==='Alles'?'temporäre kulturelle Nutzung':Q.t}"><div class="grid"><input id="av" type="date" value="${Q.a}"><input id="ab" type="date" value="${Q.b}"></div><textarea id="besch" placeholder="Kurzbeschreibung des Vorhabens"></textarea><button onclick="mail(${i})">Fertige Mail erzeugen</button>`}
function mail(i){let r=R[i],t=`Guten Tag,\n\nich interessiere mich für das Angebot „${r[0]}“ in Stuttgart.\n\nGeplante Nutzung: ${nutzung.value}\nGewünschter Zeitraum: ${av.value} bis ${ab.value}\n\nKurz zum Vorhaben:\n${besch.value||'zeitlich begrenzte kulturelle Nutzung'}\n\nKönnten Sie mir bitte mitteilen, ob die Fläche in diesem Zeitraum verfügbar und die geplante Nutzung möglich ist? Bitte nennen Sie mir auch Konditionen und gegebenenfalls erforderliche Genehmigungen.\n\nVielen Dank und freundliche Grüße`;det.innerHTML=`<h3>Bereit zum Senden</h3><textarea>${t}</textarea><button onclick="location.href='mailto:${r[8]}?subject=${encodeURIComponent('Anfrage Zwischennutzung – '+r[0])}&body=${encodeURIComponent(t)}'">Mail mit fertigem Text öffnen</button><p>Empfänger: ${r[8]}</p>`}
go()
</script>
